name: Build, audit, and lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          console.log("Dependency audit totals:", audit.metadata?.vulnerabilities ?? {});
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            const advisories = (item.via ?? [])
              .filter((advisory) => typeof advisory === "object")
              .map((advisory) => ({
                title: advisory.title,
                url: advisory.url,
                range: advisory.range,
                cwe: advisory.cwe,
                cvss: advisory.cvss,
              }));
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              affectedRange: item.range,
              fixAvailable: item.fixAvailable,
              advisories,
            }));
          }
          NODE
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
